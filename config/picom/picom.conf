# ════════════════════════════════════════════════════════════════════════════
#  hkpie rice · picom ✿ — true neubrutalist compositing
#  Square geometry, hard offset shadows, flat wallpaper colors, no soft glow.
# ════════════════════════════════════════════════════════════════════════════

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient = true;
xrender-sync-fence = false;
dbus = true;
log-level = "warn";

# Neubrutalism: nothing is rounded.
corner-radius = 0;

# ROCK-HARD offset slab shadow in the wallpaper's darkest ink: no blur at all.
shadow = true;
shadow-radius = 0;
shadow-offset-x = 12;
shadow-offset-y = 12;
shadow-opacity = 1.0;
shadow-color = "#2E2B21";
crop-shadow-to-monitor = true;

# Crisp, not soft. No old-style inactive-dim: it conflicts with rules below.
fading = false;
frame-opacity = 1.0;

# Fluent, snappy window transitions (picom v13 preset scripts).
animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.94;
    duration = 0.14;
}, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.94;
    duration = 0.12;
});

# Flat fills; pmenu draws its own shaped window, so no compositor tricks needed.
blur-background = false;
transparent-clipping = false;

rules: (
    # Firefox tab previews, autocomplete menus, tooltips and utility popups are
    # not app windows: no i3 border and no hard offset shadow on them.
    { match = "window_type = 'tooltip' || window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'utility'";
      fade = false; shadow = false; corner-radius = 0; },
    { match = "window_type = 'dock' || window_type = 'desktop'";
      shadow = false; blur-background = false; corner-radius = 0; },
    { match = "window_type = 'notification'"; shadow = true; corner-radius = 0; },
    # PMenu must keep the hard 12px slab: it is the pie version of the lock ring.
    { match = "class = 'PMenu'"; shadow = true; corner-radius = 0; },
);
