# hkpie rice · i3status — palette-matched tiny status line ✿
general {
    colors = true
    interval = 2
    output_format = i3bar
    color_good = "#2E2924"
    color_bad = "#1C1916"
    color_degraded = "#D96B5C"
    color_separator = "#B8A88E"
}

order += "cpu_usage"
order += "memory"
order += "disk /"
order += "wireless wlan0"
order += "volume master"
order += "battery 0"
order += "clock"

cpu_usage {
    format = "CPU %usage"
    format_degraded = "CPU %usage"
}

memory {
    format = "RAM %used/%total"
    threshold_degraded = "1G"
    threshold_critical = "512M"
}

disk "/" {
    format = "DISK %avail"
}

# Change wlan0 if your interface is named differently (ip link).
wireless wlan0 {
    format_up = "WIFI %essid %quality"
    format_down = "WIFI off"
}

volume master {
    format = "VOL %volume"
    format_muted = "MUTED"
    device = "default"
    mixer = "Master"
    mixer_idx = 0
}

battery 0 {
    format = "BAT %level %status"
    low_threshold = 12
}

clock {
    format = "%a %d %b  %H:%M"
}
