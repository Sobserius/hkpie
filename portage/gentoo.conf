# hkpie rice — official Gentoo binary host (amd64 / x86-64).
# Copy to /etc/portage/binrepos.conf/99-hkpie-gentoo.conf via
# scripts/install-portage.sh. For arm64, replace amd64/x86-64 with arm64/arm64.
[gentoo]
priority = 9999
sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
verify-signature = true
location = /var/cache/binhost/gentoo
